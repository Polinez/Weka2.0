<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>{{ dataset.name }}.csv</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center">Podgląd Datasetu: {{ dataset.name }}</h2>
      <div class="text-center mt-4">
        <a href="/" class="btn btn-secondary">Powrót</a>
      </div>
    <div class="table-responsive mt-4">
      <table class="table table-bordered table-striped">
        <thead>
          <tr>
            {% for column in dataset.data[0].keys() %}
              <th>{{ column }}</th>
            {% endfor %}
          </tr>
        </thead>
        <tbody>
          {% for row in dataset.data %}
            <tr>
              {% for value in row.values() %}
                <td>{{ value if value is not none else "Brak danych" }}</td>
              {% endfor %}
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

  </div>
</body>
</html>
