name: Build and Deploy to Azure Web App

on:
  push:
    branches:
      - main  # after push to main branch, the workflow will be triggered
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # set up Python version
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # python version

      # create and start virtual environment
      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
    
      # install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # optionally: you can add a step to run tests (python manage.py test)

      # 
      - name: Collect Static Files
        env:
          SECRET_KEY: "123456"
          DEBUG: "False"
        run: |
          python manage.py collectstatic --noinput

      # zip the artifact for deployment
      - name: Zip artifact for deployment
        run: zip -r release.zip . -x "venv/*" ".git/*" ".github/*" "release.zip" "./zz-extras" "./datasets"

      # upload the artifact for deployment jobs
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            release.zip
            !venv/

  # deploy job
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      # download the artifact from the build job
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # unzip the artifact for deployment
      - name: Unzip artifact for deployment
        run: unzip release.zip

      # deploy to Azure Web App
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'MLstudio' 
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}